# Run by Quickshell (services/WallpaperColors.qml) on every wallpaper change.

[config]

[templates.ghostty]
input_path = '~/.config/matugen/templates/ghostty'
output_path = '~/.cache/wallpaper-colors/ghostty'
post_hook = 'pkill -USR2 -x ghostty || true'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland.lua'
output_path = '~/.cache/wallpaper-colors/hyprland.lua'
post_hook = "hyprctl eval 'dofile(os.getenv(\"HOME\") .. \"/.cache/wallpaper-colors/hyprland.lua\")' >/dev/null || true"
